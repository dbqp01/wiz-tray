[package]
name = "wiz-tray"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
hmac = "0.12"
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winit = "0.30"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
