<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">WiZ Tray</title>
  <desc id="desc">Banner de WiZ Tray con un foco encendido sobre fondo verde oscuro.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1712"/>
      <stop offset="0.55" stop-color="#122219"/>
      <stop offset="1" stop-color="#0a120e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b04e" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#f2b04e" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f2b04e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bulb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#f2b04e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe6d8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b04e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f2b04e" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f2b04e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="600" cy="92" r="210" fill="url(#glow)"/>
  <circle cx="1050" cy="40" r="150" fill="#74d6a4" opacity="0.05"/>
  <circle cx="140" cy="280" r="170" fill="#f2b04e" opacity="0.04"/>

  <g stroke="#f2b04e" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="600" y1="26" x2="600" y2="40"/>
    <line x1="548" y1="44" x2="556" y2="56"/>
    <line x1="652" y1="44" x2="644" y2="56"/>
    <line x1="524" y1="92" x2="538" y2="92"/>
    <line x1="676" y1="92" x2="662" y2="92"/>
  </g>

  <g>
    <circle cx="600" cy="96" r="30" fill="url(#bulb)"/>
    <path d="M584 122h32v7a6 6 0 0 1-6 6h-20a6 6 0 0 1-6-6z" fill="#d99a3e"/>
    <path d="M589 135h22v5h-22z" fill="#b9812f"/>
    <path d="M592 140c0 4 3 6 8 6s8-2 8-6" fill="none" stroke="#8a5d1f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M594 108c0-5 3-8 6-10 3 2 6 5 6 10" fill="none" stroke="#7a4f16" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <text x="600" y="205" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1" fill="url(#titleGrad)">WiZ Tray</text>
  <text x="600" y="243" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="0.6" fill="#90a399">Tu luz, a un clic</text>

  <rect x="470" y="268" width="260" height="2" rx="1" fill="url(#line)"/>
</svg>
