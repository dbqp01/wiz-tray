[package]
name = "wiz-tray-app"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
wiz-tray = { path = ".." }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[workspace]
